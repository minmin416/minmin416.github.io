name: Check, optimize and publish site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_jekyll-output
      - run: cp -R _jekyll-output _site
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: riverplo-pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v4
