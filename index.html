    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: Tahoma, Verdana, Arial, sans-serif; }
    .window { width: min(100%, 474px); padding: 3px; border: 1px solid #0039b8; border-radius: 8px 8px 2px 2px; background: #0055e7; box-shadow: inset 1px 0 #418bff, inset -1px 0 #0033a0, 1px 2px 3px #0002; }
    .titlebar { height: 29px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 3px 3px; background: linear-gradient(#3b95ff 0%, #0871f6 12%, #0059eb 45%, #0050d5 87%, #003fbd 100%); color: white; border-radius: 5px 5px 0 0; }
    .title { grid-column: 2; font-size: 12px; font-weight: bold; text-shadow: 1px 1px #003586; }
    .controls { justify-self: end; display: flex; gap: 2px; }
    .control { position: relative; width: 19px; height: 20px; border: 1px solid #fff; border-radius: 3px; background: linear-gradient(135deg, #8cb8fc, #1b68df 58%, #0751c9); box-shadow: inset 1px 1px #fff5; }
    .control::after { content: ''; position: absolute; }
    .min::after { width: 7px; height: 2px; background: white; left: 4px; bottom: 4px; }
    .max::after { width: 9px; height: 9px; border: 1px solid white; border-top-width: 3px; left: 4px; top: 4px; }
    .close { background: linear-gradient(135deg, #f6b5a2, #e25030 52%, #c83315); }
    .close::before, .close::after { content: ''; position: absolute; width: 11px; height: 2px; background: white; left: 3px; top: 8px; transform: rotate(45deg); }
    .close::after { transform: rotate(-45deg); }
    main { min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 48px 24px; text-align: center; background: #ece9d8; border: 1px solid #fff; box-shadow: inset -1px -1px #d3d0c0; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(32px, 7vw, 40px); font-weight: normal; letter-spacing: -1.2px; }
    p { margin: 0; max-width: 100%; font-size: 12px; line-height: 1.7; text-wrap: balance; }
    @media (max-width: 380px) { body { padding: 20px; } main { padding: 44px 16px; } .control { width: 17px; } }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar" aria-hidden="true">
      <span class="title">Riverplo</span>
      <!-- Decorative window chrome; intentionally not interactive controls. -->
      <span class="controls" title="Decorative window frame"><span class="control min"></span><span class="control max"></span><span class="control close"></span></span>
    </div>
    <main>
      <h1>Riverplo</h1>
      <p>Independent Design &amp; AI Development Studio</p>
    </main>
  </div>
</body>
</html>
